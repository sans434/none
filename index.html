<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>None</title>
    <style>
        /* 黒背景・白文字の設定 */
        body {
            margin: 0;
            padding: 40px;
            background-color: #000000;
            color: #ffffff;
            font-family: monospace, sans-serif;
            min-height: 100vh;
            box-sizing: border-box;
        }

        /* 改行やスペースをそのまま維持して表示 */
        pre {
            white-space: pre-wrap;
            word-wrap: break-word;
            margin: 0;
            font-size: 1rem;
            line-height: 1.6;
        }
    </style>
</head>
<body>

    <pre id="content"></pre>

    <script>
        // 💡 ここに同じ階層にあるテキストファイル名を指定します
        const fileName = 'answer.txt';

        // 自動でtxtファイルを読み込んで画面に流し込む
        fetch(fileName)
            .then(response => response.text())
            .then(data => {
                document.getElementById('content').textContent = data;
            });
    </script>

</body>
</html>
